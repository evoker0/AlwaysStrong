# Build config — PlayIntegrityFork line (the default build).
#
# Sourced by build.sh. Files under ship/ are overlaid onto module/ and end up in
# the zip; everything at this level is build-time only. scripts/update-upstream.sh
# rewrites PIF_TAG / PIF_ASSET, so each line's pin sits with the line.

# Asset name suffix, so both lines fit in one release.
ZIP_SUFFIX=""

# Upstream Play Integrity engine.
PIF_REPO="osm0sis/PlayIntegrityFork"
PIF_TAG="v18"
PIF_ASSET="PlayIntegrityFork-v18.zip"

# Files lifted out of the upstream zip into the module.
PIF_FILES="autopif4.sh killpi.sh migrate.sh common_setup.sh example.pif.prop app_replace_list.txt"

# Missing any of these means upstream changed its layout: the build fails rather
# than ship a module whose fingerprint refresh quietly does nothing.
PIF_REQUIRED="autopif4.sh migrate.sh"

# Upstream scripts whose hardcoded /data/adb/modules/playintegrityfix paths are
# rewritten to our module id.
PIF_PATCH_PATHS="autopif4.sh killpi.sh migrate.sh common_setup.sh"

# Fork only: bound autopif4's wget calls and make it prefer busybox wget.
PATCH_AUTOPIF4_WGET=1

# Fork's zygisk carries no module.prop checksum check.
PIF_ANTITAMPER=0
