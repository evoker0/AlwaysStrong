# Build config — PIF-less "Lite" line.
#
# TEESimulator-RS (or TrickyStoreOSS, with --engine trickystoreoss) hardware
# attestation + the automated keybox fetcher, and NOTHING from PlayIntegrityFork
# / PlayIntegrityFix. For setups where the bundled PIF zygisk conflicts with
# Google Mobile Services (Play Store crashes, account screen won't load, missing
# dependency errors). Keeps the reliable keybox auto-update; drops the fingerprint
# spoof. See the issue about PIF vs GMS conflicts.
#
# Sourced by build.sh. There are no PIF pins here — PIF_NONE=1 tells build.sh to
# skip the whole Play Integrity download / extract / patch path.

# Asset name suffix, so this line fits alongside the others in one release.
ZIP_SUFFIX="-nopif"

# No PlayIntegrityFork / PlayIntegrityFix in this line.
PIF_NONE=1
