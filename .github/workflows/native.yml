name: Native binaries

# Rebuilds the committed native prebuilts from source on a GitHub runner, so a
# source change ships without a Rust + NDK toolchain on anyone's machine:
#   native/asfetch/prebuilt/<abi>/asfetch    from native/asfetch/src
#   native/watcher/prebuilt/<abi>/aswatcher  from native/watcher/src
#
# Runs on demand from the Actions tab; tick "commit" to push the new binaries to
# main, otherwise they are only uploaded as artifacts for testing.
#
# The release / nightly workflows never compile - they package whatever is
# committed here - so run this (with commit) after editing either source tree.
#
# Every run prints the sha256 of what it built next to the sha256 of what is
# committed, and says whether they match. That is the check anyone can repeat to
# confirm the binaries in a release really come from the sources in this repo:
# the same hashes are published in each release's SHA256SUMS.txt.

on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Commit the rebuilt prebuilts to main'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # Serialized: both jobs can push to main, and two concurrent pushes race.
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - tool: asfetch
            dir: native/asfetch
            script: scripts/build-asfetch.sh
          - tool: aswatcher
            dir: native/watcher
            script: scripts/build-watcher.sh
    name: ${{ matrix.tool }}
    steps:
      - uses: actions/checkout@v4

      - name: Record the committed hashes before rebuilding
        run: |
          set -eu
          find '${{ matrix.dir }}/prebuilt' -type f | sort | xargs sha256sum > /tmp/committed.txt
          echo "----- committed -----"; cat /tmp/committed.txt

      - name: Rust toolchain + Android targets
        run: |
          rustup update stable
          rustup target add aarch64-linux-android armv7-linux-androideabi \
                            i686-linux-android x86_64-linux-android
          cargo install cargo-ndk --locked

      - name: Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Build ${{ matrix.tool }}
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: bash '${{ matrix.script }}'

      - name: Compare the rebuild against what is committed
        # Never fails the run: a mismatch is the normal reason to be here, it
        # just means the committed prebuilts are behind the source. Tick
        # "commit" to publish the rebuild.
        run: |
          set -eu
          find '${{ matrix.dir }}/prebuilt' -type f | sort | xargs sha256sum > /tmp/rebuilt.txt
          echo "----- rebuilt -----"; cat /tmp/rebuilt.txt
          if diff -q /tmp/committed.txt /tmp/rebuilt.txt >/dev/null; then
            echo "::notice::${{ matrix.tool }}: rebuild is byte-identical to the committed prebuilts"
          else
            echo "::notice::${{ matrix.tool }}: rebuild differs from the committed prebuilts"
            diff /tmp/committed.txt /tmp/rebuilt.txt || true
          fi
          {
            echo "### ${{ matrix.tool }} sha256"
            echo
            echo '```'
            cat /tmp/rebuilt.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload prebuilts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.tool }}-prebuilt
          path: ${{ matrix.dir }}/prebuilt/**/${{ matrix.tool }}
          if-no-files-found: error

      - name: Commit to main
        if: inputs.commit
        run: |
          set -eu
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add '${{ matrix.dir }}/prebuilt'
          git diff --cached --quiet && { echo "prebuilts unchanged"; exit 0; }
          git commit -m "native: rebuild ${{ matrix.tool }} prebuilts from source"
          git pull --rebase origin main || true
          git push origin HEAD:main
