name: Upstream auto-release

# Weekly (and on-demand) check of every upstream AlwaysStrong bundles. What
# happens next depends on WHICH upstream moved:
#
#   Release triggers — TEESimulator-RS, and each line's own Play Integrity engine
#   (PlayIntegrityFork / PlayIntegrityFix inject). If any of these move:
#     1. all pins are patched (build.sh + module-variants/<line>/build.conf),
#     2. the module version is bumped one patch (v1.0.4 -> v1.0.5),
#     3. an end-user changelog is written from what actually changed, plus the
#        exact bundled versions,
#     4. the three release zips (fork / inject / nopif on TEESimulator-RS) are
#        rebuilt, and
#     5. a GitHub release is published with those notes.
#
#   Silent pins — TrickyStoreOSS and TEESimulator (JingMatrix). These are the
#   nightly-only keystore engines: never in a release, built by `build.sh
#   --engine …` and the nightly workflow. When they move their pins are still
#   refreshed and committed, but that never bumps the version or cuts a release.
#
# update-upstream.sh carries the decision in its exit code (11 = release,
# 12 = silent pins, 0 = up to date). A lookup that fails is a warning, not a red
# run — a flaky upstream never mails a half release. It also refuses to move a pin
# backwards, so a re-published older tag can't downgrade an engine.
on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zip unzip

      - name: Check upstream releases and patch the pins
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          # --stable-only: automated releases track STABLE upstreams only, never
          # canary / CI prereleases (e.g. TEESimulator's canary-NN builds). The
          # downgrade guard keeps a currently-pinned prerelease in place until a
          # newer stable actually ships, so this never rolls an engine backwards.
          ./scripts/update-upstream.sh --apply --stable-only
          code=$?
          case $code in
            0)  echo "state=none"    >> "$GITHUB_OUTPUT" ;;   # up to date
            11) echo "state=release" >> "$GITHUB_OUTPUT" ;;   # a trigger engine moved
            12) echo "state=pins"    >> "$GITHUB_OUTPUT" ;;   # only TrickyStoreOSS / TEESimulator moved
            *)  echo "state=none"    >> "$GITHUB_OUTPUT"
                echo "::warning title=Upstream check failed::update-upstream.sh exited $code — skipping this run" ;;
          esac
          exit 0

      # ------------------------- release path -------------------------
      - name: Bump version and write the changelog
        id: bump
        if: steps.check.outputs.state == 'release'
        run: ./scripts/bump-release.sh

      - name: Build the release zips with the new pins
        if: steps.check.outputs.state == 'release'
        run: |
          # committed native binaries: touch them newer than the sources so the
          # build ships them instead of needing Rust + the NDK on the runner.
          find native -path '*/prebuilt/*' -type f -exec touch {} +
          # fork / inject / nopif on TEESimulator-RS. The -TSOSS / -TEESIM engines
          # are optional and never part of a release.
          bash build.sh

      - name: Commit the bump to main
        if: steps.check.outputs.state == 'release'
        run: |
          set -eu
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add module/module.prop CHANGELOG.md build.sh module-variants
          git commit -m "release: ${{ steps.bump.outputs.new_ver }} (upstream bump)"
          git pull --rebase origin main || true       # never fight a concurrent push
          git push origin HEAD:main

      - name: Release notes from CHANGELOG
        if: steps.check.outputs.state == 'release'
        run: |
          awk -v v="## ${{ steps.bump.outputs.new_ver }}" '
            $0==v {f=1; next}
            /^## / {f=0}
            f {print}
          ' CHANGELOG.md > RELEASE_NOTES.md
          echo "----- notes -----"; cat RELEASE_NOTES.md

      - name: Publish release
        if: steps.check.outputs.state == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.new_ver }}
          target_commitish: main
          name: ${{ steps.bump.outputs.new_ver }}
          body_path: RELEASE_NOTES.md
          files: out/AlwaysStrong-*.zip
          draft: false
          prerelease: false
          fail_on_unmatched_files: true

      - name: Point the update manifests at this release
        if: steps.check.outputs.state == 'release'
        continue-on-error: true
        run: |
          set -eu
          tag="${{ steps.bump.outputs.new_ver }}"
          git fetch --no-tags origin +refs/heads/main:refs/heads/main
          git checkout main
          ver=$(sed -n 's/^version=//p' module/module.prop)
          code=$(sed -n 's/^versionCode=//p' module/module.prop)
          write_manifest() {
            printf '{\n  "version": "%s",\n  "versionCode": %s,\n  "zipUrl": "https://github.com/%s/releases/download/%s/%s",\n  "changelog": "https://raw.githubusercontent.com/%s/main/CHANGELOG.md"\n}\n' \
              "$ver" "$code" "$GITHUB_REPOSITORY" "$tag" "$2" "$GITHUB_REPOSITORY" > "$1"
          }
          write_manifest update.json        "AlwaysStrong-${ver}.zip"
          write_manifest update-inject.json "AlwaysStrong-${ver}-inject.zip"
          write_manifest update-nopif.json  "AlwaysStrong-${ver}-nopif.zip"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add update.json update-inject.json update-nopif.json
          git diff --cached --quiet && { echo "manifests already current"; exit 0; }
          git commit -m "chore: point update manifests at $tag"
          git pull --rebase origin main || true
          git push origin main

      # --------------------- silent pin path ---------------------
      # Only TrickyStoreOSS / TEESimulator(JingMatrix) moved: commit the refreshed
      # pins so the optional engines build against the newest upstream. No version
      # bump, no release.
      - name: Commit the non-triggering pin bumps (no release)
        if: steps.check.outputs.state == 'pins'
        run: |
          set -eu
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add build.sh module-variants
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "chore: refresh optional-engine pins (TrickyStoreOSS / TEESimulator)"
          git pull --rebase origin main || true
          git push origin HEAD:main
