name: Nightly

# Nightly test builds, uploaded as GitHub Actions ARTIFACTS — never a release.
# These are bleeding-edge snapshots off main between releases. Releases only
# ship the three TEESimulator-RS zips; this is also where the OPTIONAL keystore
# engines (TrickyStoreOSS -TSOSS, TEESimulator/JingMatrix -TEESIM) are built for
# anyone who wants to try them without building locally.
#
# Every variant is its own artifact with a STABLE (version-less) name, so the
# latest build of any line has a permanent direct link via nightly.link:
#   https://nightly.link/evoker0/AlwaysStrong/workflows/nightly/main            (all nine)
#   https://nightly.link/evoker0/AlwaysStrong/workflows/nightly/main/AlwaysStrong-TSOSS.zip
# The artifact IS the flashable module zip (contents are uploaded unpacked).
# or from the run's "Artifacts" section (Actions tab), or:
#   gh run download -R evoker0/AlwaysStrong --name AlwaysStrong-TSOSS

on:
  schedule:
    - cron: '0 2 * * *'   # daily, 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zip unzip

      - name: Use committed native binaries (skip the cargo-ndk step in CI)
        run: find native -path '*/prebuilt/*' -type f -exec touch {} +

      - name: Build the release lines (TEESimulator-RS)
        run: bash build.sh

      - name: Build the optional TrickyStoreOSS lines (-TSOSS)
        run: bash build.sh --engine trickystoreoss

      - name: Build the optional TEESimulator (JingMatrix) lines (-TEESIM)
        run: bash build.sh --engine teesim

      - name: List what was built
        run: ls -la out/

      # upload-artifact re-zips whatever it is given, so handing it the built
      # module zip would yield a zip-of-a-zip that has to be unpacked before
      # flashing. Unpack each variant and upload its CONTENTS instead, so the
      # downloaded artifact is itself the flashable module zip. Artifact names
      # carry no version so the nightly.link URLs stay permanent; the version
      # is in module.prop inside.
      - name: Unpack each variant into its own artifact folder
        run: |
          set -euo pipefail
          for z in out/AlwaysStrong-*.zip; do
            base=$(basename "$z" .zip)          # AlwaysStrong-v1.0.4-inject-TSOSS
            rest=${base#AlwaysStrong-}          # v1.0.4-inject-TSOSS
            variant=${rest#*-}                  # inject-TSOSS
            [[ "$variant" == "$rest" ]] && variant=fork   # no suffix = Fork line
            mkdir -p "artifacts/$variant"
            unzip -q "$z" -d "artifacts/$variant"
          done
          ls -la artifacts/*/

      - name: Upload AlwaysStrong-fork
        uses: actions/upload-artifact@v4
        with:
          name: AlwaysStrong-fork
          path: artifacts/fork
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Upload AlwaysStrong-inject
        uses: actions/upload-artifact@v4
        with:
          name: AlwaysStrong-inject
          path: artifacts/inject
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Upload AlwaysStrong-nopif
        uses: actions/upload-artifact@v4
        with:
          name: AlwaysStrong-nopif
          path: artifacts/nopif
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Upload AlwaysStrong-TSOSS
        uses: actions/upload-artifact@v4
        with:
          name: AlwaysStrong-TSOSS
          path: artifacts/TSOSS
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Upload AlwaysStrong-inject-TSOSS
        uses: actions/upload-artifact@v4
        with:
          name: AlwaysStrong-inject-TSOSS
          path: artifacts/inject-TSOSS
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Upload AlwaysStrong-nopif-TSOSS
        uses: actions/upload-artifact@v4
        with:
          name: AlwaysStrong-nopif-TSOSS
          path: artifacts/nopif-TSOSS
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Upload AlwaysStrong-TEESIM
        uses: actions/upload-artifact@v4
        with:
          name: AlwaysStrong-TEESIM
          path: artifacts/TEESIM
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Upload AlwaysStrong-inject-TEESIM
        uses: actions/upload-artifact@v4
        with:
          name: AlwaysStrong-inject-TEESIM
          path: artifacts/inject-TEESIM
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Upload AlwaysStrong-nopif-TEESIM
        uses: actions/upload-artifact@v4
        with:
          name: AlwaysStrong-nopif-TEESIM
          path: artifacts/nopif-TEESIM
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
