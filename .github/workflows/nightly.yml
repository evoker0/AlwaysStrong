name: Nightly

# Nightly test builds, uploaded as GitHub Actions ARTIFACTS — never a release.
# These are bleeding-edge snapshots off main between releases; the tagged/auto
# releases already publish the full 9-zip matrix (all three keystore engines:
# TEESimulator-RS, TrickyStoreOSS, and TEESimulator/JingMatrix). Use nightly to
# test the latest main before a release is cut.
#
# Grab a build from the run's "Artifacts" section (Actions tab), or:
#   gh run download -R <owner>/<repo> --name AlwaysStrong-nightly

on:
  schedule:
    - cron: '0 2 * * *'   # daily, 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zip unzip

      - name: Use committed native binaries (skip the cargo-ndk step in CI)
        run: find native -path '*/prebuilt/*' -type f -exec touch {} +

      - name: Build the release lines (TEESimulator-RS)
        run: bash build.sh

      - name: Build the TrickyStoreOSS lines
        run: bash build.sh --engine trickystoreoss

      - name: Build the TEESimulator (JingMatrix) lines
        run: bash build.sh --engine teesim

      - name: List what was built
        run: ls -la out/

      - name: Upload nightly artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AlwaysStrong-nightly
          path: out/AlwaysStrong-*.zip
          if-no-files-found: error
          retention-days: 30
